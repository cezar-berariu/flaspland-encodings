<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Experiment Include Graph</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
:root {
  --bg: #f7f7f5; --surface: #ffffff; --ink: #1d1d1f; --muted: #6b6b70; --faint: #b9b9be;
  --line: #d9d9dd; --group: #f0f0ee; --edge: #9a9aa2; --missing: #c4382f;
  --c0: #2a78d6; --c1: #eb6834; --c2: #1baf7a; --c3: #eda100; --c4: #e87ba4; --c5: #008300;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151517; --surface: #1e1e21; --ink: #ececef; --muted: #9c9ca4; --faint: #4d4d54;
    --line: #34343a; --group: #232327; --edge: #7a7a84; --missing: #ef6a5f;
    --c0: #3987e5; --c1: #d95926; --c2: #199e70; --c3: #c98500; --c4: #d55181; --c5: #008300;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #151517; --surface: #1e1e21; --ink: #ececef; --muted: #9c9ca4; --faint: #4d4d54;
  --line: #34343a; --group: #232327; --edge: #7a7a84; --missing: #ef6a5f;
  --c0: #3987e5; --c1: #d95926; --c2: #199e70; --c3: #c98500; --c4: #d55181; --c5: #008300;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { padding: 16px 20px 8px; display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: baseline; }
h1 { font-size: 17px; margin: 0; font-weight: 600; }
.sub { color: var(--muted); }
.controls { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; margin-left: auto; }
.controls label { display: flex; gap: 5px; align-items: center; cursor: pointer; user-select: none; }
button { font: inherit; background: var(--surface); color: var(--ink); border: 1px solid var(--line);
  border-radius: 6px; padding: 3px 10px; cursor: pointer; }
button:hover { border-color: var(--edge); }
main { display: grid; grid-template-columns: minmax(0, 1fr) 390px; gap: 0; align-items: start; }
@media (max-width: 1100px) { main { grid-template-columns: 1fr; } }
#chart { overflow: auto; padding: 0 8px 24px 16px; }
#chart svg { display: block; min-width: 1000px; width: 100%; height: auto; }
aside { position: sticky; top: 0; max-height: 100vh; overflow: auto; padding: 12px 16px 24px;
  border-left: 1px solid var(--line); background: var(--surface); min-height: 60vh; }
@media (max-width: 1100px) { aside { position: static; border-left: 0; border-top: 1px solid var(--line); max-height: none; } }
aside h2 { font-size: 15px; margin: 0 0 2px; }
aside h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 14px 0 4px; font-weight: 600; }
aside code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
aside ul { margin: 0; padding-left: 0; list-style: none; }
aside li { padding: 1px 0; word-break: break-all; }
.miss { color: var(--missing); }
.pill { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 9px; border: 1px solid var(--line); color: var(--muted); margin-left: 4px; }
table.matrix { border-collapse: collapse; width: 100%; font-size: 12px; }
table.matrix th, table.matrix td { padding: 2px 4px; text-align: center; border-bottom: 1px solid var(--line); }
table.matrix td:first-child, table.matrix th:first-child { text-align: left; word-break: break-all; }
table.matrix tr.diff td:first-child { font-weight: 600; }
table.matrix tr.same td { color: var(--muted); }
.hint { color: var(--muted); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; color: var(--muted); font-size: 12px; margin-top: 6px; }
.legend svg { vertical-align: middle; }

/* diagram */
.grp rect.box { fill: var(--group); stroke: var(--line); }
.grp text.ghead { fill: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: .02em; }
.grp.missing rect.box { stroke: var(--missing); stroke-dasharray: 4 3; }
.grp.missing text.ghead { fill: var(--missing); }
.node rect { fill: var(--surface); stroke: var(--line); rx: 4; transition: opacity .12s; }
.node text { fill: var(--ink); font-size: 12px; pointer-events: none; transition: opacity .12s; }
.node { cursor: pointer; }
.node.unused text { fill: var(--muted); }
.node.unused rect { fill: transparent; stroke-dasharray: 2 2; }
.node.missing rect { stroke: var(--missing); }
.node.missing text { fill: var(--missing); }
.node.dim rect, .node.dim text { opacity: .28; }
.node.hot rect { stroke: var(--ink); stroke-width: 1.4; }
.node.exp rect { fill: var(--surface); }
.node.exp.pinned rect { stroke-width: 2.2; }
.node.exp text.code { font-weight: 600; }
.rhead { fill: var(--muted); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
path.edge { fill: none; stroke: var(--edge); stroke-width: 1; opacity: .18; pointer-events: none; transition: opacity .12s; }
path.edge.hidden { opacity: 0; }
path.edge.on { opacity: .95; stroke-width: 2; }
path.fedge { stroke-dasharray: 4 3; }
path.fedge.on { stroke: var(--ink); stroke-width: 1.4; opacity: .7; }
path.edge.miss { stroke: var(--missing); }
.solvedbar { fill: var(--muted); opacity: .45; pointer-events: none; }
.node.dim .solvedbar { opacity: .12; }

/* results panel */
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0 8px; }
.chip { font-size: 11px; padding: 1px 8px; border-radius: 10px; }
.chip.on { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 6px 0 4px; }
.stat { border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; }
.stat b { display: block; font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
.stat span { font-size: 11px; color: var(--muted); }
.chartbox { position: relative; margin-top: 4px; }
.chartbox svg { display: block; width: 100%; height: auto; overflow: visible; }
.chartbox .grid line { stroke: var(--line); }
.chartbox .axis text { fill: var(--muted); font-size: 10px; }
.chartbox .axis path, .chartbox .axis line { stroke: var(--faint); }
.chartbox .lbl { fill: var(--ink); font-size: 11px; }
.chartbox .rule { stroke: var(--muted); stroke-width: 1; }
.tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--line);
  border-radius: 6px; padding: 4px 8px; font-size: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.12); white-space: nowrap; z-index: 2; }
.tip .sw { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; }
.rowtbl { border-collapse: collapse; width: 100%; font-size: 12px; font-variant-numeric: tabular-nums; margin-top: 6px; }
.rowtbl th { font-weight: 600; color: var(--muted); font-size: 11px; text-align: right; padding: 2px 4px; border-bottom: 1px solid var(--line); }
.rowtbl td { text-align: right; padding: 2px 4px; border-bottom: 1px solid var(--line); }
.rowtbl th:first-child, .rowtbl td:first-child { text-align: left; }
.rowtbl tr[data-pin] { cursor: pointer; }
.rowtbl tr[data-pin]:hover td { background: var(--group); }
select { font: inherit; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 2px 4px; }
</style>
</head>
<body>
<header>
  <div>
    <h1>Experiment include graph</h1>
    <div class="sub" id="subtitle"></div>
  </div>
  <div class="controls">
    <label><input type="checkbox" id="optAll" checked> Faint overview links</label>
    <label><input type="checkbox" id="optUnused" checked> Show unused encodings</label>
    <button id="clearBtn">Clear pins</button>
  </div>
</header>
<div style="padding:0 20px" class="legend">
  <span><svg width="34" height="10"><path d="M2 5H32" stroke="var(--c0)" stroke-width="2"/></svg> experiment <code>#include</code></span>
  <span><svg width="34" height="10"><path d="M2 5H32" stroke="var(--ink)" stroke-width="1.4" stroke-dasharray="4 3" opacity=".7"/></svg> include inside an encoding</span>
  <span><svg width="12" height="12"><circle cx="6" cy="6" r="4" fill="var(--c0)"/></svg> direct</span>
  <span><svg width="12" height="12"><circle cx="6" cy="6" r="3.4" fill="none" stroke="var(--c0)" stroke-width="1.5"/></svg> transitive</span>
  <span>Hover to preview · click experiments to pin &amp; compare · Esc clears</span>
</div>
<main>
  <div id="chart"></div>
  <aside id="panel"></aside>
</main>
<script>
const DATA = /*__DATA__*/null;

const PALETTE = ["--c0", "--c1", "--c2", "--c3", "--c4", "--c5"].map(v => `var(${v})`);
const fileById = new Map(DATA.files.map(f => [f.id, f]));
const expById = new Map(DATA.experiments.map(e => [e.id, e]));
const reach = new Map(Object.entries(DATA.reach).map(([k, v]) => [k, new Set(v)]));
for (const e of DATA.experiments) { e.directSet = new Set(e.direct); e.closureSet = new Set(e.closure); }

const state = { pinned: [], hoverExp: null, hoverFile: null, showAll: true, showUnused: true,
  metric: "mean_par2", src: {} };

const ROW = 22, RGAP = 4, GHEAD = 22, GPAD = 8, GGAP = 16;
const EXP_W = 150, FILE_W = 252;

// ---------- layout ----------
function layout() {
  const files = DATA.files.filter(f => state.showUnused || f.used || f.kind === "missing");
  const groups = d3.group(files, f => f.group);
  // Column assignment: 1 = included directly by experiments; 2 = only reached via other
  // encodings; 3 = not reached from any experiment. Unresolved goes at the bottom of column 1.
  const directGroups = new Set(), depGroups = new Set();
  for (const e of DATA.experiments) for (const d of e.direct) directGroups.add(fileById.get(d).group);
  for (const [s, t] of DATA.fileEdges) {
    const gs = fileById.get(s).group, gt = fileById.get(t).group;
    if (gs !== gt) depGroups.add(gt);
  }
  const useCount = g => d3.sum(DATA.experiments, e => e.closure.some(id => fileById.get(id).group === g) ? 1 : 0);
  const cols = [[], [], []];
  for (const [g, fs] of groups) {
    const col = g === "unresolved" ? 0 : directGroups.has(g) ? 0 : depGroups.has(g) ? 1 : 2;
    cols[col].push({ key: g, files: fs.sort((a, b) => d3.ascending(a.label, b.label)), uses: useCount(g) });
  }
  cols[0].sort((a, b) => (a.key === "unresolved") - (b.key === "unresolved") || b.uses - a.uses || d3.ascending(a.key, b.key));
  cols[1].sort((a, b) => b.uses - a.uses || d3.ascending(a.key, b.key));
  cols[2].sort((a, b) => d3.ascending(a.key, b.key));
  const usedCols = cols.filter(c => c.length);

  // Experiments column, grouped by README round.
  const exps = [...DATA.experiments].sort((a, b) => a.order - b.order || d3.ascending(a.code, b.code));
  const rounds = d3.groups(exps, e => e.round);
  const expPos = new Map(), roundHeads = [];
  let y = 8;
  for (const [r, es] of rounds) {
    roundHeads.push({ label: r, y: y + 12 });
    y += 20;
    for (const e of es) { expPos.set(e.id, { x: 0, y, w: EXP_W, h: ROW }); y += ROW + RGAP; }
    y += 10;
  }
  let height = y;

  const gaps = [200, 130, 110];
  const filePos = new Map(), groupBoxes = [];
  let x = EXP_W;
  usedCols.forEach((col, ci) => {
    x += gaps[ci];
    let gy = 8;
    for (const g of col) {
      const h = GHEAD + g.files.length * (ROW + RGAP) - RGAP + GPAD;
      groupBoxes.push({ key: g.key, x: x - GPAD, y: gy, w: FILE_W + 2 * GPAD, h });
      let fy = gy + GHEAD;
      for (const f of g.files) { filePos.set(f.id, { x, y: fy, w: FILE_W, h: ROW, col: ci }); fy += ROW + RGAP; }
      gy += h + GGAP;
    }
    height = Math.max(height, gy);
    x += FILE_W;
  });
  return { expPos, filePos, groupBoxes, roundHeads, width: x + 60, height: height + 10, exps };
}

function hPath(x1, y1, x2, y2) {
  const mx = (x1 + x2) / 2;
  return `M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`;
}
function fileEdgePath(s, t) {
  const y1 = s.y + s.h / 2, y2 = t.y + t.h / 2;
  if (t.col > s.col) return hPath(s.x + s.w, y1, t.x, y2);
  if (t.col < s.col) return hPath(s.x, y1, t.x + t.w, y2);
  const k = 28 + Math.abs(y2 - y1) * 0.12;
  return `M${s.x + s.w},${y1} C${s.x + s.w + k},${y1} ${t.x + t.w + k},${y2} ${t.x + t.w},${y2}`;
}

// ---------- render ----------
let L, sel = {};
function render() {
  L = layout();
  const root = d3.select("#chart").html("");
  const svg = root.append("svg").attr("viewBox", `0 0 ${L.width} ${L.height}`)
    .attr("width", L.width).attr("height", L.height)
    .style("max-width", `${L.width}px`);
  svg.on("click", ev => { if (ev.target === svg.node()) { state.pinned = []; update(); } });

  svg.append("g").selectAll("g").data(L.groupBoxes).join("g")
    .attr("class", d => "grp" + (d.key === "unresolved" ? " missing" : ""))
    .call(g => g.append("rect").attr("class", "box").attr("rx", 8)
      .attr("x", d => d.x).attr("y", d => d.y).attr("width", d => d.w).attr("height", d => d.h))
    .call(g => g.append("text").attr("class", "ghead").attr("x", d => d.x + GPAD).attr("y", d => d.y + 15)
      .text(d => d.key === "unresolved" ? "⚠ unresolved includes" : d.key + "/"));

  svg.append("g").selectAll("text").data(L.roundHeads).join("text")
    .attr("class", "rhead").attr("x", 2).attr("y", d => d.y).text(d => d.label);

  // Edges: one path per (experiment, direct include), plus one per file->file include.
  const expEdges = [];
  for (const e of DATA.experiments) for (const d of e.direct) {
    const a = L.expPos.get(e.id), b = L.filePos.get(d);
    if (a && b) expEdges.push({ exp: e.id, file: d, path: hPath(a.x + a.w, a.y + a.h / 2, b.x, b.y + b.h / 2) });
  }
  const fileEdges = DATA.fileEdges.filter(([s, t]) => L.filePos.has(s) && L.filePos.has(t))
    .map(([s, t]) => ({ s, t, path: fileEdgePath(L.filePos.get(s), L.filePos.get(t)) }));

  sel.fedges = svg.append("g").selectAll("path").data(fileEdges).join("path")
    .attr("class", d => "edge fedge" + (fileById.get(d.t).kind === "missing" ? " miss" : "")).attr("d", d => d.path);
  sel.eedges = svg.append("g").selectAll("path").data(expEdges).join("path")
    .attr("class", d => "edge eedge" + (fileById.get(d.file).kind === "missing" ? " miss" : "")).attr("d", d => d.path);

  // Experiment nodes
  sel.exps = svg.append("g").selectAll("g").data(L.exps).join("g")
    .attr("class", "node exp")
    .attr("transform", d => { const p = L.expPos.get(d.id); return `translate(${p.x},${p.y})`; })
    .on("mouseenter", (ev, d) => { state.hoverExp = d.id; update(); })
    .on("mouseleave", () => { state.hoverExp = null; update(); })
    .on("click", (ev, d) => {
      const i = state.pinned.indexOf(d.id);
      if (i >= 0) state.pinned.splice(i, 1);
      else state.pinned.push(d.id);
      update();
    });
  sel.exps.append("title").text(d => d.path + (d.desc ? "\n" + d.desc : ""));
  sel.exps.append("rect").attr("width", EXP_W).attr("height", ROW);
  sel.exps.append("text").attr("class", "code").attr("x", 8).attr("y", 15).text(d => d.id.replace(/\.lp$/, ""));
  sel.exps.append("text").attr("class", "cnt").attr("x", EXP_W - 8).attr("y", 15).attr("text-anchor", "end")
    .style("fill", "var(--muted)").style("font-size", "11px").text(d => d.closure.length);
  sel.exps.filter(d => d.results && d.results.length).append("rect").attr("class", "solvedbar")
    .attr("x", 1).attr("y", ROW - 3).attr("height", 2)
    .attr("width", d => { const t = totals(d.results[0]); return (EXP_W - 2) * t.solved / t.n; });
  sel.exps.select("title").text(d => d.path + (d.desc ? "\n" + d.desc : "") +
    (d.results && d.results.length ? `\nsolved ${totals(d.results[0]).solved}/${totals(d.results[0]).n} (${d.results[0].source})` : ""));
  sel.expMarks = sel.exps.append("rect").attr("class", "mark").attr("x", 0).attr("y", 0)
    .attr("width", 4).attr("height", ROW).style("stroke", "none").style("fill", "transparent");

  // File nodes
  const fileList = DATA.files.filter(f => L.filePos.has(f.id));
  sel.files = svg.append("g").selectAll("g").data(fileList).join("g")
    .attr("class", d => "node file" + (d.used ? "" : " unused") + (d.kind === "missing" ? " missing" : ""))
    .attr("transform", d => { const p = L.filePos.get(d.id); return `translate(${p.x},${p.y})`; })
    .on("mouseenter", (ev, d) => { state.hoverFile = d.id; update(); })
    .on("mouseleave", () => { state.hoverFile = null; update(); });
  sel.files.append("title").text(d => d.kind === "missing" ? `unresolved: ${d.raw}\n(tried ${d.id})` : d.id);
  sel.files.append("rect").attr("width", FILE_W).attr("height", ROW);
  sel.files.append("text").attr("x", 8).attr("y", 15)
    .text(d => d.kind === "missing" ? d.raw : d.label.replace(/\.lp$/, ""))
    .each(function (d) { // truncate long labels
      const max = d.kind === "missing" ? FILE_W - 14 : FILE_W - 60;
      let t = d3.select(this), s = t.text();
      while (this.getComputedTextLength() > max && s.length > 4) { s = s.slice(d.kind === "missing" ? 1 : 0, d.kind === "missing" ? undefined : -1); t.text(d.kind === "missing" ? "…" + s : s + "…"); }
    });
  sel.dots = sel.files.append("g").attr("transform", `translate(${FILE_W - 8},${ROW / 2})`);

  update();
}

// ---------- interaction ----------
function colorOf(id) {
  const i = state.pinned.indexOf(id);
  return PALETTE[(i >= 0 ? i : state.pinned.length) % PALETTE.length];
}
function activeExps() {
  const a = [...state.pinned];
  if (state.hoverExp && !a.includes(state.hoverExp)) a.push(state.hoverExp);
  return a;
}
const reaches = (from, to) => from === to || (reach.get(from) && reach.get(from).has(to));

function update() {
  const F = state.hoverFile;
  const act = F ? [] : activeExps();
  const anyActive = !!F || act.length > 0;

  let expOn, fileOn, eedgeOn, fedgeOn;
  if (F) {
    const users = new Set(DATA.experiments.filter(e => e.closureSet.has(F)).map(e => e.id));
    expOn = id => users.has(id);
    fileOn = id => id === F || reaches(id, F) || reaches(F, id);
    eedgeOn = d => users.has(d.exp) && reaches(d.file, F);
    fedgeOn = d => reaches(d.t, F) || reaches(F, d.s);
  } else if (act.length) {
    const actSet = new Set(act);
    const files = new Set(act.flatMap(id => expById.get(id).closure));
    expOn = id => actSet.has(id);
    fileOn = id => files.has(id);
    eedgeOn = d => actSet.has(d.exp);
    fedgeOn = d => files.has(d.s) && files.has(d.t);
  }

  sel.exps.classed("dim", d => anyActive && !expOn(d.id))
    .classed("pinned", d => state.pinned.includes(d.id))
    .classed("hot", d => d.id === state.hoverExp);
  sel.exps.select("rect:first-of-type").style("stroke", d => state.pinned.includes(d.id) ? colorOf(d.id) : null);
  sel.expMarks.style("fill", d => (act.includes(d.id) ? colorOf(d.id) : (F && expOn(d.id) ? "var(--ink)" : "transparent")));

  sel.files.classed("dim", d => anyActive && !fileOn(d.id)).classed("hot", d => d.id === F);

  sel.eedges.classed("on", d => anyActive && eedgeOn(d))
    .classed("hidden", d => anyActive ? !eedgeOn(d) : !state.showAll)
    .style("stroke", d => (!F && anyActive && eedgeOn(d) && fileById.get(d.file).kind !== "missing") ? colorOf(d.exp) : null)
    .filter(".on").raise();
  sel.fedges.classed("on", d => anyActive && fedgeOn(d))
    .classed("hidden", d => !(anyActive && fedgeOn(d)));

  // Per-file dots: one per active experiment, filled = direct include, hollow = transitive.
  sel.dots.each(function (f) {
    const items = act.filter(id => expById.get(id).closureSet.has(f.id))
      .map(id => ({ id, direct: expById.get(id).directSet.has(f.id) }));
    d3.select(this).selectAll("circle").data(items, d => d.id).join("circle")
      .attr("cx", (d, i) => -i * 10).attr("r", d => d.direct ? 4 : 3.4)
      .style("fill", d => d.direct ? colorOf(d.id) : "none")
      .style("stroke", d => colorOf(d.id)).style("stroke-width", d => d.direct ? 0 : 1.5);
  });

  renderPanel(F, act);
  const h = state.pinned.length ? "#pin=" + state.pinned.join(",") : "";
  if (location.hash !== h) history.replaceState(null, "", h || location.pathname + location.search);
}

// ---------- side panel ----------
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const short = id => id.replace(/^encodings\//, "");
function fileLine(id, extra = "") {
  const f = fileById.get(id);
  const cls = f.kind === "missing" ? ' class="miss"' : "";
  return `<li${cls}><code>${esc(f.kind === "missing" ? f.id + "  (missing)" : short(id))}</code>${extra}</li>`;
}

function renderPanel(F, act) {
  const p = document.getElementById("panel");
  if (F) {
    const f = fileById.get(F);
    const direct = DATA.experiments.filter(e => e.directSet.has(F));
    const trans = DATA.experiments.filter(e => !e.directSet.has(F) && e.closureSet.has(F));
    const incBy = DATA.fileEdges.filter(([, t]) => t === F).map(([s]) => s);
    p.innerHTML = `
      <h2 class="mono">${esc(f.label)}</h2>
      <div class="hint mono">${esc(f.kind === "missing" ? "not found: " + f.id : f.id)}</div>
      ${f.raw && f.kind === "missing" ? `<div class="miss">written as <code>${esc(f.raw)}</code></div>` : ""}
      ${f.comment ? `<p class="hint">${esc(f.comment)}</p>` : ""}
      <h3>Included directly by (${direct.length})</h3>
      <ul>${direct.map(e => `<li><code>${esc(e.id)}</code></li>`).join("") || '<li class="hint">—</li>'}</ul>
      <h3>Reached via other encodings (${trans.length})</h3>
      <ul>${trans.map(e => `<li><code>${esc(e.id)}</code></li>`).join("") || '<li class="hint">—</li>'}</ul>
      <h3>Includes</h3>
      <ul>${f.includes.map(i => fileLine(i.target)).join("") || '<li class="hint">—</li>'}</ul>
      <h3>Included by encodings</h3>
      <ul>${incBy.map(s => fileLine(s)).join("") || '<li class="hint">—</li>'}</ul>`;
    return;
  }
  if (act.length === 1) {
    const e = expById.get(act[0]);
    const indirect = e.closure.filter(id => !e.directSet.has(id));
    p.innerHTML = `
      <h2><span style="color:${colorOf(e.id)}">●</span> <span class="mono">${esc(e.id)}</span></h2>
      <div class="hint">${esc(e.round)}${state.pinned.includes(e.id) ? '<span class="pill">pinned</span>' : ""}</div>
      ${e.desc ? `<p>${esc(e.desc)}</p>` : ""}
      ${e.comment ? `<p class="hint">${esc(e.comment)}</p>` : ""}
      <h3>#include (${e.includes.length})</h3>
      <ul>${e.includes.map(i => fileLine(i.target, i.status === "root" ? ' <span class="pill">via repo root</span>' : "")).join("")}</ul>
      ${e.consts.length ? `<h3>#const</h3><ul>${e.consts.map(c => `<li><code>${esc(c)}</code></li>`).join("")}</ul>` : ""}
      ${resultsSingle(e)}
      <h3>Pulled in transitively (${indirect.length})</h3>
      <ul>${indirect.map(id => fileLine(id)).join("") || '<li class="hint">—</li>'}</ul>
      <p class="hint" style="margin-top:16px">${state.pinned.includes(e.id) ? "Click more experiments to compare them." : "Click to pin, then click others to compare."}</p>`;
    const r = srcFor(e);
    if (r) drawChart(p.querySelector(".chartbox"), [{ id: e.id, name: e.code, color: colorOf(e.id), rows: r.rows }]);
    return;
  }
  if (act.length > 1) {
    const es = act.map(id => expById.get(id));
    const order = new Map([...L.filePos.keys()].map((k, i) => [k, i]));
    const union = [...new Set(es.flatMap(e => e.closure))].sort((a, b) => (order.get(a) ?? 1e9) - (order.get(b) ?? 1e9));
    const rows = union.map(id => {
      const cells = es.map(e => e.directSet.has(id) ? "direct" : e.closureSet.has(id) ? "trans" : "");
      return { id, cells, same: cells.every(c => c) };
    });
    const nSame = rows.filter(r => r.same).length;
    const consts = es.some(e => e.consts.length)
      ? `<tr class="diff"><td><em>#const</em></td>${es.map(e => `<td class="mono" style="font-size:11px">${esc(e.consts.join("; ").replace(/^h\s*=\s*/, "")) || "—"}</td>`).join("")}</tr>` : "";
    p.innerHTML = `
      <h2>Comparing ${es.length} experiments</h2>
      <div class="hint">${rows.length - nSame} differing files, ${nSame} shared by all</div>
      <h3>Include differences</h3>
      <table class="matrix" style="margin-top:10px">
        <tr><th></th>${es.map(e => `<th style="color:${colorOf(e.id)}">${esc(e.code)}</th>`).join("")}</tr>
        ${rows.filter(r => !r.same).concat(rows.filter(r => r.same)).map(r => `<tr class="${r.same ? "same" : "diff"}">
          <td class="mono${fileById.get(r.id).kind === "missing" ? " miss" : ""}">${esc(short(r.id).replace(/\.lp$/, ""))}</td>
          ${r.cells.map((c, i) => `<td>${c === "direct" ? `<span style="color:${colorOf(es[i].id)}">●</span>` : c === "trans" ? `<span style="color:${colorOf(es[i].id)}">○</span>` : ""}</td>`).join("")}
        </tr>`).join("")}
        ${consts}
      </table>
      <p class="hint">● direct include · ○ pulled in transitively. Differences listed first.</p>
      ${resultsCompare(es)}`;
    const series = es.filter(srcFor).map(e => ({ id: e.id, name: e.code, color: colorOf(e.id), rows: srcFor(e).rows }));
    if (series.length) drawChart(p.querySelector(".chartbox"), series);
    return;
  }
  const missing = DATA.files.filter(f => f.kind === "missing");
  const brokenExps = DATA.experiments.filter(e => e.closure.some(id => fileById.get(id).kind === "missing"));
  const encs = DATA.files.filter(f => f.kind === "encoding");
  p.innerHTML = `
    <h2>Overview</h2>
    <p>${DATA.experiments.length} experiments · ${encs.length} encoding files, ${encs.filter(f => f.used).length} of them used by at least one experiment.</p>
    ${leaderboard()}
    <p class="hint">Hover an experiment to trace its includes; hover an encoding to see every experiment that depends on it. Click experiments to pin them; pin two or more to get a comparison table. The number on each experiment is the total count of files it loads.</p>
    ${missing.length ? `<h3 class="miss">Unresolved includes (${missing.length})</h3>
      <ul>${missing.map(f => `<li class="miss"><code>${esc(f.raw)}</code></li>`).join("")}</ul>
      <h3>Experiments affected</h3>
      <ul>${brokenExps.map(e => `<li><code>${esc(e.id)}</code></li>`).join("")}</ul>` : ""}`;
}

// ---------- results ----------
const METRICS = [
  { key: "mean_par2", label: "Mean PAR2 (s)", log: true },
  { key: "median_time", label: "Median time, solved only (s)", log: true },
  { key: "solved_pct", label: "Solved (%)", log: false, max: 100 },
  { key: "mean_grounding", label: "Mean grounding time (s)", log: true },
  { key: "mean_solving", label: "Mean solving time (s)", log: true },
  { key: "mean_rules", label: "Mean rules", log: true },
  { key: "mean_variables", label: "Mean variables", log: true },
  { key: "mean_constraints", label: "Mean constraints", log: true },
  { key: "mean_mem", label: "Mean memory (btool mem)", log: true },
];
for (const e of DATA.experiments) for (const r of e.results || []) for (const row of r.rows) row.solved_pct = 100 * row.solved / row.n;
const metric = () => METRICS.find(m => m.key === state.metric);
const fmt = v => v == null || Number.isNaN(v) ? "—" : Math.abs(v) >= 1e5 ? d3.format(".3s")(v) : Math.abs(v) >= 100 ? d3.format(",.0f")(v) : d3.format(".3~g")(v);
const srcLabel = r => r.date + (r.variant ? " · " + r.variant : "");
function srcFor(e) {
  if (!e.results || !e.results.length) return null;
  return e.results.find(r => r.source === state.src[e.id]) || e.results[0];
}
function totals(r) {
  const t = { n: 0, solved: 0, timeouts: 0, memouts: 0, failed: 0, par2: 0 };
  for (const row of r.rows) { for (const k of ["n", "solved", "timeouts", "memouts", "failed"]) t[k] += row[k]; t.par2 += (row.mean_par2 ?? 0) * row.n; }
  return t;
}
function metricSelect() {
  return `<select id="metricSel">${METRICS.map(m => `<option value="${m.key}"${m.key === state.metric ? " selected" : ""}>${esc(m.label)}</option>`).join("")}</select>`;
}
function resultsSingle(e) {
  if (!e.results || !e.results.length) return `<h3>Results</h3><p class="hint">No results spreadsheet found for <code>${esc(e.code)}</code>.</p>`;
  const r = srcFor(e), t = totals(r);
  const chips = e.results.length > 1 ? `<div class="chips">${e.results.map(x =>
    `<button class="chip${x === r ? " on" : ""}" data-src="${esc(x.source)}" data-exp="${esc(e.id)}">${esc(srcLabel(x))}</button>`).join("")}</div>` : "";
  return `<h3>Results</h3>${chips}
    <div class="hint mono" style="font-size:11px">${esc(r.file)} · ${esc(r.system)}${r.limit ? ` · limit ${fmt(r.limit)}s` : ""}</div>
    <div class="stats">
      <div class="stat"><b>${t.solved}/${t.n}</b><span>solved</span></div>
      <div class="stat"><b>${t.timeouts}</b><span>timeouts</span></div>
      <div class="stat"><b>${t.memouts}</b><span>memouts</span></div>
      <div class="stat"><b>${fmt(t.par2 / t.n)}</b><span>mean PAR2 s</span></div>
    </div>
    ${t.failed ? `<div class="miss" style="font-size:12px">${t.failed} runs killed or without a status</div>` : ""}
    <div style="margin-top:8px">${metricSelect()}</div>
    <div class="chartbox"></div>
    <table class="rowtbl"><tr><th>trains</th><th>solved</th><th>TO</th><th>MO</th><th>median s</th><th>ground s</th><th>PAR2 s</th></tr>
    ${r.rows.map(x => `<tr><td>${x.trains}</td><td>${x.solved}/${x.n}</td><td>${x.timeouts || ""}</td><td>${x.memouts || ""}</td><td>${fmt(x.median_time)}</td><td>${fmt(x.mean_grounding)}</td><td>${fmt(x.mean_par2)}</td></tr>`).join("")}
    </table>`;
}
function resultsCompare(es) {
  const withRes = es.filter(srcFor);
  if (!withRes.length) return `<h3>Results</h3><p class="hint">None of these experiments have results.</p>`;
  const m = metric();
  const trains = [...new Set(withRes.flatMap(e => srcFor(e).rows.map(r => r.trains)))].sort((a, b) => a - b);
  const missing = es.filter(e => !srcFor(e)).map(e => e.code);
  return `<h3>Results</h3>
    <div>${metricSelect()}</div>
    <div class="chartbox"></div>
    <table class="rowtbl"><tr><th>trains</th>${withRes.map(e => `<th><span style="color:${colorOf(e.id)}">●</span> ${esc(e.code)}</th>`).join("")}</tr>
      ${trains.map(tr => `<tr><td>${tr}</td>${withRes.map(e => { const row = srcFor(e).rows.find(r => r.trains === tr); return `<td>${row ? fmt(row[m.key]) : ""}</td>`; }).join("")}</tr>`).join("")}
      <tr><td><em>solved</em></td>${withRes.map(e => { const t = totals(srcFor(e)); return `<td>${t.solved}/${t.n}</td>`; }).join("")}</tr>
      <tr><td><em>source</em></td>${withRes.map(e => `<td style="font-size:10px">${esc(srcLabel(srcFor(e)))}</td>`).join("")}</tr>
    </table>
    ${missing.length ? `<p class="hint">No results: ${missing.map(esc).join(", ")}</p>` : ""}`;
}
function leaderboard() {
  const rows = DATA.experiments.filter(e => e.results && e.results.length).map(e => ({ e, r: e.results[0], t: totals(e.results[0]) }))
    .sort((a, b) => b.t.solved / b.t.n - a.t.solved / a.t.n || a.t.par2 / a.t.n - b.t.par2 / b.t.n);
  if (!rows.length) return "";
  const none = DATA.experiments.filter(e => !e.results || !e.results.length).map(e => e.code);
  return `<h3>Results (latest run per experiment)</h3>
    <table class="rowtbl"><tr><th>exp</th><th>solved</th><th>TO</th><th>MO</th><th>PAR2 s</th><th>date</th></tr>
    ${rows.map(({ e, r, t }) => `<tr data-pin="${esc(e.id)}"><td class="mono">${esc(e.code)}</td><td>${t.solved}/${t.n}</td><td>${t.timeouts || ""}</td><td>${t.memouts || ""}</td><td>${fmt(t.par2 / t.n)}</td><td style="font-size:11px">${esc(r.date.slice(5))}</td></tr>`).join("")}
    </table>
    <p class="hint">Sorted by solved share, then mean PAR2. Click a row to pin it.${none.length ? ` No results: ${none.map(esc).join(", ")}.` : ""}</p>`;
}
function drawChart(el, series) {
  if (!el) return;
  const m = metric();
  const W = 358, H = 210, mg = { t: 10, r: series.length <= 4 ? 46 : 12, b: 30, l: 44 };
  const pts = series.flatMap(s => s.rows.filter(r => r[m.key] != null && (!m.log || r[m.key] > 0)).map(r => ({ s, x: r.trains, v: r[m.key], row: r })));
  if (!pts.length) { el.innerHTML = `<p class="hint">No values for this metric.</p>`; return; }
  const xs = [...new Set(pts.map(p => p.x))].sort((a, b) => a - b);
  const x = d3.scaleLinear().domain(xs.length > 1 ? d3.extent(xs) : [xs[0] - 1, xs[0] + 1]).range([mg.l, W - mg.r]);
  let [lo, hi] = d3.extent(pts, p => p.v);
  let y;
  if (m.log) { if (lo === hi) { lo /= 2; hi *= 2; } y = d3.scaleLog().domain([lo, hi]).nice(); }
  else y = d3.scaleLinear().domain([0, m.max ?? hi]).nice();
  y.range([H - mg.b, mg.t]);
  const svg = d3.select(el).html("").append("svg").attr("viewBox", `0 0 ${W} ${H}`);
  const yt = m.log ? y.ticks(4).filter(t => Number.isInteger(Math.log10(t)) || y.ticks(4).length < 6) : y.ticks(4);
  svg.append("g").attr("class", "grid").selectAll("line").data(yt).join("line")
    .attr("x1", mg.l).attr("x2", W - mg.r).attr("y1", y).attr("y2", y);
  svg.append("g").attr("class", "axis").attr("transform", `translate(${mg.l},0)`)
    .call(d3.axisLeft(y).tickValues(yt).tickFormat(fmt).tickSize(0).tickPadding(6)).call(g => g.select(".domain").remove());
  svg.append("g").attr("class", "axis").attr("transform", `translate(0,${H - mg.b})`)
    .call(d3.axisBottom(x).tickValues(xs).tickFormat(d3.format("d")).tickSizeOuter(0));
  svg.append("text").attr("class", "axis").attr("x", W - mg.r).attr("y", H - 2).attr("text-anchor", "end")
    .style("fill", "var(--muted)").style("font-size", "10px").text("trains");
  const line = d3.line().x(p => x(p.x)).y(p => y(p.v));
  const byS = d3.group(pts, p => p.s);
  for (const [s, ps] of byS) {
    svg.append("path").attr("d", line(ps)).attr("fill", "none").attr("stroke", s.color).attr("stroke-width", 2);
    svg.append("g").selectAll("circle").data(ps).join("circle").attr("cx", p => x(p.x)).attr("cy", p => y(p.v)).attr("r", 4)
      .attr("fill", s.color).attr("stroke", "var(--surface)").attr("stroke-width", 2);
  }
  if (series.length <= 4) { // direct labels at line ends, nudged apart
    const ends = [...byS].map(([s, ps]) => ({ s, x: x(ps[ps.length - 1].x), y: y(ps[ps.length - 1].v) })).sort((a, b) => a.y - b.y);
    for (let i = 1; i < ends.length; i++) ends[i].y = Math.max(ends[i].y, ends[i - 1].y + 12);
    svg.append("g").selectAll("text").data(ends).join("text").attr("class", "lbl")
      .attr("x", d => d.x + 8).attr("y", d => d.y + 4).text(d => d.s.name);
  }
  // hover: crosshair + tooltip listing every series at that train count
  const rule = svg.append("line").attr("class", "rule").attr("y1", mg.t).attr("y2", H - mg.b).style("display", "none");
  const tip = d3.select(el).append("div").attr("class", "tip").style("display", "none");
  svg.append("rect").attr("x", mg.l - 10).attr("y", 0).attr("width", W - mg.l - mg.r + 20).attr("height", H)
    .attr("fill", "transparent")
    .on("mousemove", ev => {
      const [mx] = d3.pointer(ev);
      const xv = xs.reduce((a, b) => Math.abs(x(b) - mx) < Math.abs(x(a) - mx) ? b : a);
      rule.attr("x1", x(xv)).attr("x2", x(xv)).style("display", null);
      const here = series.map(s => ({ s, row: s.rows.find(r => r.trains === xv) })).filter(d => d.row);
      tip.style("display", null).html(`<b>${xv} trains</b><br>` + here.map(d =>
        `<span class="sw" style="background:${d.s.color}"></span>${esc(d.s.name)}: <b>${fmt(d.row[m.key])}</b> <span class="hint">(${d.row.solved}/${d.row.n} solved)</span>`).join("<br>"));
      const bw = el.getBoundingClientRect().width, px = x(xv) / W * bw;
      tip.style("left", `${Math.min(px + 12, bw - tip.node().offsetWidth)}px`).style("top", "4px");
    })
    .on("mouseleave", () => { rule.style("display", "none"); tip.style("display", "none"); });
}

// ---------- boot ----------
const panelEl = document.getElementById("panel");
panelEl.addEventListener("change", ev => { if (ev.target.id === "metricSel") { state.metric = ev.target.value; update(); } });
panelEl.addEventListener("click", ev => {
  const chip = ev.target.closest("[data-src]");
  if (chip) { state.src[chip.dataset.exp] = chip.dataset.src; update(); return; }
  const row = ev.target.closest("[data-pin]");
  if (row && !state.pinned.includes(row.dataset.pin)) { state.pinned.push(row.dataset.pin); update(); }
});
document.getElementById("subtitle").textContent =
  `${DATA.root}/benchmarking/experiments → encodings/`;
document.getElementById("optAll").addEventListener("change", ev => { state.showAll = ev.target.checked; update(); });
document.getElementById("optUnused").addEventListener("change", ev => { state.showUnused = ev.target.checked; render(); });
document.getElementById("clearBtn").addEventListener("click", () => { state.pinned = []; update(); });
document.addEventListener("keydown", ev => { if (ev.key === "Escape") { state.pinned = []; update(); } });
const m = location.hash.match(/pin=([^&]+)/);
if (m) state.pinned = decodeURIComponent(m[1]).split(",").filter(id => expById.has(id));
render();
</script>
</body>
</html>
